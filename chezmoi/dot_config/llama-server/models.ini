; llama-server preset config
; Save at ~/.config/llama-server/models.ini (or any path you like)
; Launch with: llama-server --host 0.0.0.0 --port 8080 --models-preset ~/.config/llama-server/models.ini

version = 1

; Section name is your custom alias for this model (shown in /v1/models,
; the web UI, and OpenCode's /models picker). Since we're giving it a
; friendly name instead of the raw repo:quant string, "m" below points
; directly at the .gguf file so the router knows which file it maps to.
; This is the same file your original -hf download already cached.
[qwen3-coder]
m = /Users/tijs/.cache/huggingface/hub/models--unsloth--Qwen3-Coder-30B-A3B-Instruct-GGUF/snapshots/b17cb02dd882d5b6ab62fc777ad2995f19668350/Qwen3-Coder-30B-A3B-Instruct-Q5_K_M.gguf

; Context window size in tokens (prompt + generation combined).
; Bigger = more memory used. This matches your original -c 32768.
ctx-size = 262144

; Number of transformer layers to offload to GPU. 99 is higher than this
; model has, so it just means "offload everything to GPU."
n-gpu-layers = 99

; Enables Flash Attention: a faster, more memory-efficient attention
; implementation. Worth leaving on unless your backend doesn't support it.
flash-attn = on

; Use the chat template embedded in the model's GGUF metadata (or a
; built-in one) to format prompts, instead of a hardcoded template.
; Needed for correct tool-calling/chat formatting on newer models.
jinja = on

; Sampling temperature: higher = more random/creative, lower = more
; deterministic. 0.7 is Qwen's own recommended value for this model.
temp = 0.7

; Nucleus sampling: only consider tokens within the top 80% cumulative
; probability. Qwen's recommended value for this model.
top-p = 0.8

; Only consider the 20 most likely next tokens before other filters apply.
; Qwen's recommended value for this model.
top-k = 20

; Minimum probability a token needs, relative to the top token's
; probability, to be considered at all. 0.0 = disabled.
min-p = 0.0

; Penalizes tokens simply for having appeared anywhere earlier in the
; output (regardless of how often). 0.0 = disabled.
presence-penalty = 0.0

; Penalizes tokens that already appeared recently, to reduce repetition.
; 1.0 = disabled, higher = stronger penalty. Qwen recommends 1.05 here.
repeat-penalty = 1.05
